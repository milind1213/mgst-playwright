name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build app
        run: |
          # Run build only if a build script is defined; otherwise skip gracefully
          if npm run | grep -q " build"; then
            echo "Found build script, running npm run build"
            npm run build
          else
            echo "No build script defined in package.json — skipping build step"
          fi

  test_unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run Vitest
        run: npx vitest run --reporter=verbose 

  deploy:
    name: Deploy (mock)
    runs-on: ubuntu-latest
    needs: [test_unit]
    container:
      image: alpine:latest
    steps:
      - name: Mock deployment
        run: echo 'Mock deployment was successful!'

  smoke_tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [build, test_unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Debug Playwright environment
        run: |
          echo "--- node & npm versions ---"
          node -v
          npm -v
          echo "--- npx playwright version ---"
          npx playwright --version || true
          echo "--- list @playwright/test package tree (top-level) ---"
          npm ls @playwright/test --depth=0 || true
          echo "--- list all @playwright/test packages (if any) ---"
          npm ls @playwright/test --all || true

      - name: Run Playwright smoke tests
        env:
          CI: true
        run: npm run test:smoke

      - name: Upload Playwright smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report

